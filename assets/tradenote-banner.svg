<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img">
  <title>TradeNote</title>
  <desc>Illustrated concept graphic: an invoice, a buyer confirmation, and a funding mark above a line for an XRP Ledger record. It is not a live ledger or payment screen.</desc>
  <style type="text/css"><![CDATA[
    .halo {
      opacity: 0;
      animation: stage-pulse 7.5s ease-in-out infinite;
    }
    .halo-confirm { animation-delay: 2.5s; }
    .halo-advance { animation-delay: 5s; }
    .traveler {
      offset-rotate: 0deg;
      offset-path: path("M278 212 H325");
      animation: connector-flow 7.5s linear infinite;
    }
    .traveler-settle {
      offset-path: path("M475 212 H522");
      animation-delay: 3.75s;
    }
    @keyframes stage-pulse {
      0%, 18%, 100% { opacity: 0; }
      8% { opacity: 0.7; }
    }
    @keyframes connector-flow {
      0% { offset-distance: 0%; opacity: 0; }
      6% { opacity: 1; }
      42% { offset-distance: 100%; opacity: 1; }
      50%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo, .traveler {
        animation: none !important;
      }
      .halo { opacity: 0 !important; }
      .traveler { opacity: 1 !important; offset-distance: 0% !important; }
    }
  ]]></style>
  <rect width="800" height="380" fill="#0E1A22"/>
  <rect x="8" y="8" width="784" height="364" fill="none" stroke="#C6A15B" stroke-width="2"/>
  <circle cx="690" cy="56" r="88" fill="none" stroke="#1A3140" stroke-width="1.5"/>
  <circle cx="690" cy="56" r="54" fill="none" stroke="#1A3140" stroke-width="1.5"/>
  <text x="400" y="78" text-anchor="middle" fill="#F7F4EE" font-family="Inter, 'Noto Sans', sans-serif" font-size="52" font-weight="600">TradeNote</text>
  <rect x="348" y="94" width="104" height="4" fill="#C6A15B"/>
  <g fill="none" stroke="#C6A15B" stroke-width="2">
    <rect class="halo" x="122" y="118" width="162" height="188" rx="18" opacity="0"/>
    <rect class="halo halo-confirm" x="319" y="118" width="162" height="188" rx="18" opacity="0"/>
    <rect class="halo halo-advance" x="516" y="118" width="162" height="188" rx="18" opacity="0"/>
  </g>
  <g fill="#F6F2E9">
    <rect x="128" y="124" width="150" height="176" rx="16"/>
    <rect x="325" y="124" width="150" height="176" rx="16"/>
    <rect x="522" y="124" width="150" height="176" rx="16"/>
  </g>
  <g fill="none" stroke="#1B2C34" stroke-width="3.25" stroke-linejoin="round" stroke-linecap="round">
    <path d="M178 160 H224 L244 180 V252 H178 Z"/>
    <path d="M224 160 V180 H244"/>
    <path d="M190 198 H230"/>
    <path d="M190 214 H230"/>
    <path d="M190 230 H214"/>
  </g>
  <circle cx="400" cy="198" r="36" fill="#1F7A4D"/>
  <path d="M384 200 L396 212 L418 186" fill="none" stroke="#F7F4EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="564" y="220" width="16" height="32" rx="3" fill="#1B2C34"/>
    <rect x="590" y="200" width="16" height="52" rx="3" fill="#1B2C34"/>
    <rect x="616" y="174" width="16" height="78" rx="3" fill="#C6A15B"/>
  </g>
  <g fill="none" stroke="#C6A15B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 212 H308"/>
    <path d="M300 204 L310 212 L300 220"/>
    <path d="M483 212 H505"/>
    <path d="M495 204 L505 212 L495 220"/>
  </g>
  <circle class="traveler" r="3.5" fill="#F3E6C4" opacity="0"/>
  <circle class="traveler traveler-settle" r="3.5" fill="#F3E6C4" opacity="0"/>
  <path d="M128 328 H672" fill="none" stroke="#C6A15B" stroke-width="2"/>
  <circle cx="203" cy="328" r="4.5" fill="#C6A15B"/>
  <circle cx="400" cy="328" r="4.5" fill="#C6A15B"/>
  <circle cx="597" cy="328" r="4.5" fill="#C6A15B"/>
</svg>
